<html lang="en">
  <head>
    <meta charset="UTF-8" />

      content="Experienced Software Engineer with strong UI/UX skills, an analytical mindset, and over 6 years of expertise in the complete product development lifecycle.">

    <link rel="author" href="https://tun-online.web.app/">
    <meta name="keywords"
      content="Myanmar, Tun Lin Phyo, Myanamr Software Developer, Myanamr Software Engineer, HTML,CSS,JavaScript,TypeScript,Programmer,Developer,Frontend,Frontend Developer,Software,Software Engineer,React,Vue,Svelte">
    <meta name="creator" content="Tun Lin Phyo">
    <meta name="publisher" content="Tun Lin Phyo">
    <meta property="article:published_time" content="2026-03-28" />

    <meta name="robots" content="index, follow">
    <meta name="googlebot"
      content="index, follow, noimageindex, max-video-preview:-1, max-image-preview:large, max-snippet:-1">

    <meta property="og:title" content="Tun Lin Phyo">
    <meta property="og:description"
      content="Experienced Software Engineer with strong UI/UX skills, an analytical mindset, and over 6 years of expertise in the complete product development lifecycle.">
    <meta property="og:site_name" content="Software Engineer (Portfolio)">
    <meta property="og:url" content="https://tun-online.com/">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="/tunlinphyo.png">
    <meta property="og:type" content="website">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
      fetchpriority="high">
  </head>
  <body>
    <svg width="0" height="0" viewBox="0 0 24 24" aria-hidden="true" role="presentation" style="position: absolute;overflow: hidden;">
      <defs>
        <linearGradient id="grayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--gray-start)" />
          <stop offset="100%" stop-color="var(--gray-end)" />
        </linearGradient>
      </defs>

      <defs>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="var(--accent-start)" />
          <stop offset="100%" stop-color="var(--accent-end)" />
        </linearGradient>
      </defs>

      <defs>
        <linearGradient id="linkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="var(--link-start)" />
          <stop offset="100%" stop-color="var(--link-end)" />
        </linearGradient>
      </defs>

      <defs>
        <linearGradient id="moonGradient" x1="0%" y1="50%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="deepskyblue" />
          <stop offset="100%" stop-color="color-mix(in oklab, deepskyblue, Canvas 40%)" />
        </linearGradient>
      </defs>
    </svg>
    <main>
      <header>
        <button class="contact-button" popovertarget="contact" aria-label="Open Tun`s contact list">
          <span>About • Contact</span>
        </button>

        <button id="toggle" class="sunmoon">
          <sun-moon theme="light" size="2rem" sun-color="orangered" moon-color="url(#moonGradient)"></sun-moon>
        </button>
      </header>

      <section class="intro">
        <h1>Frontend Engineer</h1>
        <p>focused on design systems, accessibility, and modern web technologies.</p>
      </section>

      <footer>
        <button class="circle-button testimonial-open" commandfor="testimonial" command="show-modal"
          aria-haspopup="dialog" aria-controls="testimonial" aria-label="Open testimonials dialog">
          <span class="info">What People Say</span>
        </button>
      </footer>
    </main>

    <about-contact id="contact" class="contact" popover role="region" aria-labelledby="about-me-title">
      <contact-card slot="contact" data-inert-aboutme></contact-card>
      <about-me slot="about" id="aboutme" toggle inert role="region" aria-labelledby="aboutme-title"></about-me>
    </about-contact>

    <dialog id="testimonial" class="testimonials" aria-labelledby="testimonial-title">
      <button type="button" commandfor="testimonial" command="close" class="circle-button testimonial-close" aria-label="Close testimonials dialog"></button>

      <what-people-say></what-people-say>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
